[project]
name = "Stockie"
version = "0.1.0"
description = "Stock trading system"
authors = [{ name = "Frank Kornet" }]
dependencies = [
  "yfinance==0.2.63",
  "pandas==2.3.0",
  "numpy==2.3.0",
  "psycopg2-binary==2.9.10",
  "pandas_market_calendars==5.1.0",
  "pyyaml (>=6.0.2,<7.0.0)",
  "python-dotenv (>=1.1.0,<2.0.0)",
  "ipykernel (>=6.29.5,<7.0.0)",
  "lxml (>=5.4.0,<6.0.0)",
]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
yfinance = "0.2.63"
pandas = "2.3.0"
numpy = "2.3.0"
psycopg2-binary = "2.9.10"
pandas_market_calendars = "5.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "8.4.1"
pytest-cov = "*"

[tool.poetry.group.runtime.dependencies]
beautifulsoup4="4.13.4"
certifi="2025.6.15"
cffi="1.17.1"
charset-normalizer="3.4.2"
curl_cffi="0.11.4"
exchange_calendars="4.10.1"
frozendict="2.4.6"
idna="3.10"
iniconfig="2.1.0"
korean-lunar-calendar="0.3.1"
multitasking="0.0.11"
packaging="25.0"
peewee="3.18.1"
platformdirs="4.3.8"
pluggy="1.6.0"
protobuf="6.31.1"
pycparser="2.22"
pyluach="2.2.0"
python-dateutil="2.9.0.post0"
pytz="2025.2"
requests="2.32.4"
soupsieve="2.7"
toolz="1.0.0"
tzdata="2025.2"
urllib3="^2.4.0"
websockets="15.0.1"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["test"]
python_files = ["*Test.py"]
